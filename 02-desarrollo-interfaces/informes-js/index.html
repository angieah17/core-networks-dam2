<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informe calificaciones</title>
    <link href="css/reset.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">

    <style>
      @media print {/* reglas específicas para impresión */

        /* Márgenes y tamaño de página */
      @page {
        margin: 2cm;
        size: A4;
      }

      /* Cuerpo */
    body {
      color: #333;
      font-size: 11pt;
      line-height: 1.4;
      font-family: Arial, sans-serif;
    }

    /* Ocultar elementos innecesarios */
    nav {
      display: none;
    }

    button {
      display: none;
    }

    /* Título */
    h1 {
      font-size: 18pt;
      margin-bottom: 10pt;
      border-bottom: 2px solid #333;
      padding-bottom: 8pt;
    }

    /* Párrafo de fecha */
    .obs {
      font-size: 10pt;
      color: #666;
      margin-bottom: 15pt;
    }

    /* Tabla */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20pt;
      font-size: 10pt;
    }

    thead {
      background-color: #e0e0e0;
      font-weight: bold;
    }

    th, td {
      border: 1px solid #999;
      padding: 6pt 8pt;
      text-align: center;
    }

    th {
      background-color: #d0d0d0;
      font-weight: bold;
    }

        
      }
    </style>

</head>

<body>
<nav>
<button id="generar-informe">Generar informe</button>
<button id="guardar-pdf">Guardar como PDF</button>
</nav>

<section class="reporte">
  <h1>Informe de calificaciones</h1>
  <p class="obs" id="fecha"></p>

  <table>
    <thead>
      <tr>
        <th>Alumno</th>
        <th>Matemáticas</th>
        <th>Lengua</th>
        <th>Historia</th>
        <th>Ciencias</th>
        <th>Promedio</th>
      </tr>
    </thead>
    <tbody id="tabla"></tbody>
  </table>

  <footer class="estadisticas">
    <aside class="caja">
      <strong>Promedio por asignatura</strong>
      <ul id="promediosAsignatura"></ul>
    </aside>

    <aside class="caja">
      <strong>Observaciones</strong>
      <p class="obs">
        Informe generado automáticamente a partir de datos simulados usando JavaScript.
      </p>
    </aside>
  </footer>
</section>

<script>
  function imprimir(params) {
    window.print();
  }

  document.getElementById("guardar-pdf").addEventListener("click", imprimir);
</script>


    <script src="js/script.js"></script>
</body>

</html>
