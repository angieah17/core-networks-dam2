version: "3.9"

services:
  web:
    build: ./docker/php
    container_name: php_api-rios
    ports:
      - "8087:80"
    volumes:
      - ./src:/var/www/html:cached
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
    depends_on:
      - db


  db:
    image: mysql:8.0
    container_name: mysql_db_riosdoc
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rios
    volumes:
      - contenido-php_db_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_api_rios
    restart: always
    ports:
      - "8088:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root

volumes:
  contenido-php_db_data:
